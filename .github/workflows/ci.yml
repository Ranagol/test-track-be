name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# Don’t run multiple CI workflows for the same branch/ref at the same time. If a new one starts, cancel the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────
  # PINT
  # ─────────────────────────────
  pint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/php-setup

      - run: ./vendor/bin/pint --test

  # ─────────────────────────────
  # LARASTAN
  # ─────────────────────────────
  larastan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/php-setup

      - run: ./vendor/bin/phpstan analyse --memory-limit=2G --no-progress

  # ─────────────────────────────
  # PHPMD
  # ─────────────────────────────
  phpmd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/php-setup

      - run: XDEBUG_MODE=off ./vendor/bin/phpmd app ansi phpmd.xml

  # ─────────────────────────────
  # PHPUNIT (with DB)
  # ─────────────────────────────
  phpunit:
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: test_track
          MYSQL_USER: test_track_user
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_KEY: base64:0000000000000000000000000000000000000000000=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: test_track
      DB_USERNAME: test_track_user
      DB_PASSWORD: secret
      FRONTEND_URL: http://127.0.0.1:5174
      VITE_API_BASE_URL: http://127.0.0.1:8001

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/php-setup

      - run: php artisan key:generate --ansi
      - run: php artisan migrate --force --ansi
      - run: php artisan test --compact

  # ─────────────────────────────
  # ts-types (Frontend type checking)
  # ─────────────────────────────
  ts-types:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/node-setup

      - run: cd test-track-fe && npm run type-check

  # ─────────────────────────────
  # PLAYWRIGHT (E2E tests with DB)
  # ─────────────────────────────
  playwright:
    runs-on: ubuntu-24.04

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_DATABASE: test_track
          MYSQL_USER: test_track_user
          MYSQL_PASSWORD: secret
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      APP_KEY: base64:0000000000000000000000000000000000000000000=
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: test_track
      DB_USERNAME: test_track_user
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/php-setup

      - uses: ./.github/actions/node-setup

      - run: php artisan migrate:fresh --seed --env=testing --ansi
      - run: cd test-track-fe && npx playwright install
      - run: cd test-track-fe && npx playwright test

  # ─────────────────────────────
  # DEPLOY
  # ─────────────────────────────
  deploy:
    runs-on: ubuntu-24.04
    needs: [pint, larastan, phpmd, phpunit, ts-types, playwright]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - run: echo "Successfully deployed"
