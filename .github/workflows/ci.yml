name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  # ─────────────────────────────
  # PINT
  # ─────────────────────────────
  pint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/php-setup
        with:
          php-version: "8.5"

      - run: ./vendor/bin/pint --test

  # ─────────────────────────────
  # LARASTAN
  # ─────────────────────────────
  larastan:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/php-setup
        with:
          php-version: "8.5"

      - run: ./vendor/bin/phpstan analyse --memory-limit=2G --no-progress

  # ─────────────────────────────
  # PHPMD
  # ─────────────────────────────
  phpmd:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/php-setup
        with:
          php-version: "8.5"

      - run: XDEBUG_MODE=off ./vendor/bin/phpmd app ansi phpmd.xml

  # ─────────────────────────────
  # PHPUNIT (with DB)
  # ─────────────────────────────
  phpunit:
    runs-on: ubuntu-24.04

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: test_track
          POSTGRES_USER: test_track_user
          POSTGRES_PASSWORD: secret
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      APP_ENV: testing
      APP_KEY: base64:0000000000000000000000000000000000000000000=
      DB_CONNECTION: pgsql
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_DATABASE: test_track
      DB_USERNAME: test_track_user
      DB_PASSWORD: secret

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/php-setup
        with:
          php-version: "8.5"

      - run: php artisan key:generate --ansi
      - run: php artisan migrate --force --ansi
      - run: php artisan test --compact

  # ─────────────────────────────
  # FRONTEND
  # ─────────────────────────────
  frontend:
    runs-on: ubuntu-24.04

    defaults:
      run:
        working-directory: test-track-fe

    steps:
      - uses: actions/checkout@v4

      - uses: ./.github/actions/node-setup
        with:
          node-version: "22"
          working-directory: "test-track-fe"

      - run: npm run type-check

  # ─────────────────────────────
  # DEPLOY
  # ─────────────────────────────
  deploy:
    runs-on: ubuntu-24.04
    needs: [pint, larastan, phpmd, phpunit, frontend]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - run: echo "Successfully deployed"
