name: "Node Setup"
description: "Setup Node.js with npm caching"

inputs:
  node-version:
    description: "Node.js version to set up (e.g., 18)"
    required: true
  working-directory:
    description: "Working directory for npm commands"
    required: true
    default: "./test-track-fe"

runs:
  using: "composite"

  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}
        cache: npm
        cache-dependency-path: ${{ inputs.working-directory }}/package-lock.json

    - name: Cache npm global store
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: npm-ci-v1-${{ hashFiles(format('{0}/package-lock.json', inputs.working-directory)) }}
        restore-keys: npm-ci-v1-

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: npm ci
