# This is the configuration for production. We use this in Oracle, not in local development.
# This is actually the second level nginx in the reverse proxy setup. This file will be used in the
# production Nginx docker container.
# The first level is the Oracle server level nginx reverse proxy...
# This was used for Laravel, and the beginning, when I only wanted to serve the Laravel backend in
# Oracle.
server {
    listen 80;
    server_name _;

    root /var/www/html/public;
    index index.php index.html;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
    }
}


